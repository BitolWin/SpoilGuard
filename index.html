  const NONE = { en: 'No matches', es: 'Sin resultados', ca: 'Cap resultat', fr: 'Aucun résultat', de: 'Keine Treffer', it: 'Nessun risultato', nl: 'Geen resultaten', pl: 'Brak wyników', 'pt-BR': 'Nada encontrado', 'pt-PT': 'Sem resultados', tr: 'Sonuç yok', ru: 'Ничего не найдено', ja: '見つかりません', 'zh-CN': '无结果', 'zh-TW': '沒有結果', ko: '결과 없음', id: 'Tidak ada hasil', vi: 'Không có kết quả', hi: 'कोई परिणाम नहीं', th: 'ไม่พบผลลัพธ์', bn: 'কোনো ফল নেই', uk: 'Нічого не знайдено', fil: 'Walang resulta', ms: 'Tiada padanan', ro: 'Niciun rezultat' };

  const from = new URLSearchParams(location.search).get('back');

  };

  };

    const n = norm(q.trim());

    act = -1;
  };

  const open = () => { list(); $('#langSearch').value = ''; menu.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); setTimeout(() => $('#langSearch').focus(), 30); };

    const it = items();

  // idioma: ?lang=xx; dentro de la extensión, el mismo que usa SpoilGuard; si no, inglés
  const match = l => {
    if (!l) return null;
    if (P[l]) return l;
    const low = l.toLowerCase();
    if (low.startsWith('pt')) return /br/.test(low) ? 'pt-BR' : 'pt-PT';
    if (low.startsWith('zh')) return /tw|hk|mo|hant/.test(low) ? 'zh-TW' : 'zh-CN';
    if (/^(fil|tl)/.test(low)) return P.fil ? 'fil' : null;
    const base = low.split('-')[0];
    return P[base] ? base : null;
  };
  const q = match(new URLSearchParams(location.search).get('lang'));
  render(q || 'en');

  // el icono y los acentos con el color del tema que haya elegido el usuario
  const HUE = { violet: [248, 90], blue: [215, 90], teal: [184, 80], green: [148, 65], amber: [40, 95], orange: [22, 92], red: [355, 78], pink: [325, 80], graphite: [225, 8] };
  try {
    chrome.storage.local.get(['lang', 'ui']).then(({ lang, ui }) => {
      let u = ui && HUE[ui.hue];
      if (ui && ui.hue === 'custom' && /^#[0-9a-f]{6}$/i.test(ui.custom || '')) {   // color a medida: hex → tono y saturación
        const n = parseInt(ui.custom.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
        let h = 0; if (d) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
        u = [Math.round(h), d ? Math.round(d / (1 - Math.abs(2 * l - 1)) * 100) : 0];
      }
      if (u) {
        const r = document.documentElement.style;
        r.setProperty('--g1', `hsl(${u[0]} ${u[1]}% 58%)`);
        r.setProperty('--g2', `hsl(${u[0] + 22} ${u[1]}% 68%)`);
        r.setProperty('--acc', `hsl(${u[0]} ${u[1]}% ${matchMedia('(prefers-color-scheme: dark)').matches ? 74 : 52}%)`);
      }
      if (!q) { const m = match(lang && lang !== 'auto' ? lang : navigator.language); if (m && m !== cur) render(m); }
    }).catch(() => {});
  } catch (_) {
    // copia pública (GitHub): fuera de la extensión, el idioma del navegador del visitante
    if (!q) { const m = match(navigator.language); if (m && m !== cur) render(m); }
  }
})();

</script>
