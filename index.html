<style>
  :root { --bg: #f6f5fd; --fg: #1c2033; --mut: #5d6380; --acc: #5b4be8; --card: #fff; --bd: #e2e0f2; --hov: #efedfb; --g1: #6d5efc; --g2: #a06bff; }

  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }

  .lang-menu { position: absolute; right: 0; top: calc(100% + .4rem); z-index: 10; width: min(22rem, calc(100vw - 2rem)); background: var(--card); border: 1px solid var(--bd); border-radius: .9rem; box-shadow: 0 14px 40px rgba(20, 16, 60, .18); padding: .5rem; opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events: none; transition: opacity .16s, transform .16s; }

<script>
/* SpoilGuard · textos de la política de privacidad (15 idiomas). Contenido fijo escrito a mano. */
globalThis.SG_PRIV = {
en: { name: 'English', t: 'Privacy policy', u: 'Last updated: 17 November 2026 · Version 1.0',
 lead: '<strong>SpoilGuard does not collect, share or sell any of your data.</strong> It has no server. Everything happens inside your browser, and it even works with no internet connection at all.',
 s: [
 ['What SpoilGuard stores, and where', '<p>Only what you set up yourself: your word lists and exceptions, your settings (language, colours, icon), the extra websites you added and a counter of how many spoilers were hidden. It is all kept in your browser’s local storage, on your own computer.</p>'],
 ['What it reads, and what it doesn’t keep', '<p>To know what to cover, SpoilGuard reads the text of the page you have open, on the spot, and compares it with your lists. That text is never saved, logged or sent anywhere. SpoilGuard does not keep your browsing history or a list of the pages you visit.</p>'],
 ['Optional sync', '<p>It is off unless you turn it on. If you do, a copy of your lists and settings is stored by <em>your browser’s own sync</em> in your account, the same way it syncs your bookmarks, so they appear on your other computers. SpoilGuard still doesn’t connect to anything itself. Turning sync off deletes the copy from your account.</p>'],
 ['Permissions', '<ul><li><strong>Storage</strong>: to keep your lists and settings.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok and Twitch</strong>: to cover spoilers on those sites.</li><li><strong>Other sites, only if you add them</strong>: the browser asks you one site at a time, and removing a site withdraws the permission.</li><li><strong>Active tab</strong>: to know which site you are on when you press “Also protect this site”.</li><li><strong>Scripting</strong>: to switch the filter on in the sites you added.</li><li><strong>Context menus</strong>: for the right-click option “Block with SpoilGuard”. You can turn it off in Settings.</li></ul>'],
 ['Check it yourself', '<p>You don’t need to take our word for it. Three quick checks:</p><ol><li><strong>Go offline.</strong> Turn off your Wi-Fi and open a saved page: SpoilGuard keeps working, because it never needed the internet.</li><li><strong>Watch the network.</strong> Press <kbd>F12</kbd> on any site, open the <em>Network</em> tab and use SpoilGuard as usual. You won’t see a single request made by SpoilGuard.</li><li><strong>Read the code.</strong> All the code ships inside the extension, readable and not obfuscated. Nothing is downloaded later.</li></ol>'],
 ['External links', '<p>SpoilGuard contains two kinds of links: the Ko-fi button (to leave an optional tip) and links like this policy. They only open a page when you click them, and SpoilGuard sends nothing along with them. Ko-fi is an independent service with its own privacy policy. Tipping never unlocks anything: SpoilGuard is complete and free for everyone.</p>'],
 ['Children', '<p>SpoilGuard collects no data from anyone, so it collects none from children either. It shows no ads and has no accounts, chats or ways to contact strangers.</p>'],
 ['Changes to this policy', '<p>If SpoilGuard ever needed to handle data differently, you would be told clearly inside the extension before the change took effect, this page would be updated with the new date, and nothing would change without your consent.</p>'],
 ['Contact', '<p>For questions, suggestions or bug reports, leave a review or use the support section on SpoilGuard’s page in your browser’s extension store. Every message is read.</p>']]},
es: { name: 'Español', t: 'Política de privacidad', u: 'Última actualización: 17 de noviembre de 2026 · Versión 1.0',
 lead: '<strong>SpoilGuard no recoge, ni comparte ni vende ningún dato tuyo.</strong> No tiene servidor. Todo ocurre dentro de tu navegador, y funciona incluso sin conexión a internet.',
 s: [
 ['Qué guarda SpoilGuard y dónde', '<p>Solo lo que configuras tú: tus listas de palabras y excepciones, tus ajustes (idioma, colores, icono), las webs que has añadido y un contador de cuántos spoilers se han ocultado. Todo se guarda con el almacenamiento local de tu navegador, en tu propio ordenador.</p>'],
 ['Qué lee y qué no guarda', '<p>Para saber qué tapar, SpoilGuard lee el texto de la página que tienes abierta, en el momento, y lo compara con tus listas. Ese texto nunca se guarda, ni se registra, ni se envía a ningún sitio. SpoilGuard no guarda tu historial ni la lista de páginas que visitas.</p>'],
 ['Sincronización (opcional)', '<p>Está apagada salvo que tú la enciendas. Si lo haces, una copia de tus listas y ajustes la guarda <em>la propia sincronización de tu navegador</em> en tu cuenta, igual que tus marcadores, para que aparezcan en tus otros ordenadores. SpoilGuard sigue sin conectarse a nada. Al apagarla, la copia se borra de tu cuenta.</p>'],
 ['Permisos', '<ul><li><strong>Almacenamiento</strong>: para guardar tus listas y ajustes.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok y Twitch</strong>: para tapar los spoilers en esas webs.</li><li><strong>Otras webs, solo si tú las añades</strong>: el navegador te pregunta web a web, y al quitarla se retira el permiso.</li><li><strong>Pestaña activa</strong>: para saber en qué web estás cuando pulsas «Proteger también esta web».</li><li><strong>Scripting</strong>: para activar el filtro en las webs que has añadido.</li><li><strong>Menús contextuales</strong>: para la opción del clic derecho «Vetar en SpoilGuard». Puedes quitarla en Ajustes.</li></ul>'],
 ['Compruébalo tú', '<p>No hace falta que nos creas. Tres comprobaciones rápidas:</p><ol><li><strong>Desconéctate.</strong> Apaga el wifi y abre una página guardada: SpoilGuard sigue funcionando, porque nunca ha necesitado internet.</li><li><strong>Mira la red.</strong> Pulsa <kbd>F12</kbd> en cualquier web, abre la pestaña <em>Red</em> y usa SpoilGuard con normalidad. No verás ni una sola petición hecha por SpoilGuard.</li><li><strong>Lee el código.</strong> Todo el código va dentro de la extensión, legible y sin ofuscar. No se descarga nada después.</li></ol>'],
 ['Enlaces externos', '<p>SpoilGuard tiene dos tipos de enlaces: el botón de Ko-fi (para dejar una propina opcional) y enlaces como esta política. Solo abren una página cuando los pulsas, y SpoilGuard no envía nada con ellos. Ko-fi es un servicio independiente con su propia política de privacidad. Dar propina nunca desbloquea nada: SpoilGuard está completo y es gratis para todos.</p>'],
 ['Menores', '<p>SpoilGuard no recoge datos de nadie, así que tampoco de menores. No muestra anuncios y no tiene cuentas, chats ni formas de contactar con desconocidos.</p>'],
 ['Cambios en esta política', '<p>Si algún día SpoilGuard necesitara tratar datos de otra forma, se te avisaría con claridad dentro de la extensión antes de que el cambio tuviera efecto, esta página se actualizaría con la nueva fecha y nada cambiaría sin tu consentimiento.</p>'],
 ['Contacto', '<p>Para dudas, sugerencias o fallos, deja una reseña o usa la sección de asistencia de la página de SpoilGuard en la tienda de extensiones de tu navegador. Se leen todos los mensajes.</p>']]},
ca: { name: 'Català', t: 'Política de privadesa', u: 'Darrera actualització: 17 de novembre de 2026 · Versió 1.0',
 lead: '<strong>SpoilGuard no recull, no comparteix i no ven cap dada teva.</strong> No té servidor. Tot passa dins del teu navegador, i funciona fins i tot sense connexió a internet.',
 s: [
 ['Què desa SpoilGuard i on', '<p>Només el que configures tu: les teves llistes de paraules i excepcions, els ajustaments (idioma, colors, icona), les webs que has afegit i un comptador de spoilers ocults. Tot es desa a l’emmagatzematge local del navegador, al teu ordinador.</p>'],
 ['Què llegeix i què no desa', '<p>Per saber què tapar, SpoilGuard llegeix el text de la pàgina que tens oberta, en el moment, i el compara amb les teves llistes. Aquest text mai no es desa, ni es registra, ni s’envia enlloc. SpoilGuard no desa el teu historial.</p>'],
 ['Sincronització (opcional)', '<p>Està apagada si no l’encens. Si ho fas, una còpia de les llistes i ajustaments la desa <em>la sincronització del teu navegador</em> al teu compte, com les adreces d’interès. SpoilGuard continua sense connectar-se a res. Si l’apagues, la còpia s’esborra del compte.</p>'],
 ['Permisos', '<ul><li><strong>Emmagatzematge</strong>: per desar les llistes i els ajustaments.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok i Twitch</strong>: per tapar els spoilers en aquestes webs.</li><li><strong>Altres webs, només si les afegeixes</strong>: el navegador et pregunta web a web.</li><li><strong>Pestanya activa</strong>: per saber a quina web ets quan prems «Protegir també aquesta web».</li><li><strong>Scripting</strong>: per activar el filtre a les webs que has afegit.</li><li><strong>Menús contextuals</strong>: per a l’opció del clic dret «Vetar a SpoilGuard». La pots treure a Ajustaments.</li></ul>'],
 ['Comprova-ho tu', '<p>No cal que ens creguis:</p><ol><li><strong>Desconnecta’t.</strong> Apaga el wifi: SpoilGuard continua funcionant.</li><li><strong>Mira la xarxa.</strong> Prem <kbd>F12</kbd>, obre la pestanya <em>Xarxa</em> i fes servir SpoilGuard: no hi veuràs cap petició seva.</li><li><strong>Llegeix el codi.</strong> Tot el codi va dins l’extensió, llegible i sense ofuscar.</li></ol>'],
 ['Enllaços externs', '<p>El botó de Ko-fi (propina opcional) i enllaços com aquesta política només obren una pàgina quan els prems, i SpoilGuard no hi envia res. Ko-fi és un servei independent amb la seva pròpia política. Donar propina no desbloqueja res: SpoilGuard és complet i gratuït.</p>'],
 ['Menors', '<p>SpoilGuard no recull dades de ningú, tampoc de menors. No té anuncis, comptes ni xats.</p>'],
 ['Canvis', '<p>Si mai calgués tractar dades d’una altra manera, se t’avisaria clarament dins l’extensió abans del canvi, s’actualitzaria aquesta pàgina i res no canviaria sense el teu consentiment.</p>'],
 ['Contacte', '<p>Per a dubtes, suggeriments o errors, deixa una ressenya o fes servir la secció d’assistència de la pàgina de SpoilGuard a la botiga d’extensions del teu navegador. Es llegeixen tots els missatges.</p>']]},
fr: { name: 'Français', t: 'Politique de confidentialité', u: 'Dernière mise à jour : 17 novembre 2026 · Version 1.0',
 lead: '<strong>SpoilGuard ne collecte, ne partage et ne vend aucune de vos données.</strong> Il n’a pas de serveur. Tout se passe dans votre navigateur, et il fonctionne même sans connexion internet.',
 s: [
 ['Ce que SpoilGuard enregistre, et où', '<p>Uniquement ce que vous configurez : vos listes de mots et exceptions, vos réglages (langue, couleurs, icône), les sites ajoutés et un compteur de spoilers masqués. Tout reste dans le stockage local de votre navigateur, sur votre ordinateur.</p>'],
 ['Ce qu’il lit, et ce qu’il ne garde pas', '<p>Pour savoir quoi masquer, SpoilGuard lit le texte de la page ouverte, sur le moment, et le compare à vos listes. Ce texte n’est jamais enregistré ni envoyé. SpoilGuard ne garde pas votre historique.</p>'],
 ['Synchronisation (facultative)', '<p>Désactivée sauf si vous l’activez. Dans ce cas, une copie de vos listes et réglages est stockée par <em>la synchronisation de votre navigateur</em> dans votre compte, comme vos favoris. SpoilGuard ne se connecte toujours à rien. En la désactivant, la copie est supprimée.</p>'],
 ['Autorisations', '<ul><li><strong>Stockage</strong> : pour garder vos listes et réglages.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok et Twitch</strong> : pour masquer les spoilers sur ces sites.</li><li><strong>Autres sites, seulement si vous les ajoutez</strong> : le navigateur demande site par site.</li><li><strong>Onglet actif</strong> : pour savoir sur quel site vous êtes quand vous appuyez sur « Protéger aussi ce site ».</li><li><strong>Scripting</strong> : pour activer le filtre sur les sites ajoutés.</li><li><strong>Menus contextuels</strong> : pour l’option du clic droit « Bloquer avec SpoilGuard ». Vous pouvez la désactiver dans les Réglages.</li></ul>'],
 ['Vérifiez par vous-même', '<ol><li><strong>Déconnectez-vous.</strong> Coupez le Wi-Fi : SpoilGuard continue de fonctionner.</li><li><strong>Observez le réseau.</strong> Appuyez sur <kbd>F12</kbd>, ouvrez l’onglet <em>Réseau</em> et utilisez SpoilGuard : aucune requête de sa part.</li><li><strong>Lisez le code.</strong> Tout le code est dans l’extension, lisible et non obfusqué.</li></ol>'],
 ['Liens externes', '<p>Le bouton Ko-fi (pourboire facultatif) et les liens comme cette politique n’ouvrent une page que si vous cliquez, et SpoilGuard n’envoie rien. Ko-fi est un service indépendant. Un pourboire ne débloque rien : SpoilGuard est complet et gratuit.</p>'],
 ['Enfants', '<p>SpoilGuard ne collecte de données sur personne, enfants compris. Ni publicité, ni comptes, ni chats.</p>'],
 ['Modifications', '<p>Si SpoilGuard devait un jour traiter des données autrement, vous seriez prévenu clairement dans l’extension avant le changement, cette page serait mise à jour et rien ne changerait sans votre accord.</p>'],
 ['Contact', '<p>Pour toute question, suggestion ou bug, laissez un avis ou utilisez la section d’assistance de la page de SpoilGuard dans la boutique d’extensions de votre navigateur. Chaque message est lu.</p>']]},
de: { name: 'Deutsch', t: 'Datenschutzerklärung', u: 'Zuletzt aktualisiert: 17. November 2026 · Version 1.0',
 lead: '<strong>SpoilGuard sammelt, teilt und verkauft keine deiner Daten.</strong> Es hat keinen Server. Alles passiert in deinem Browser, und es funktioniert sogar ganz ohne Internet.',
 s: [
 ['Was SpoilGuard speichert und wo', '<p>Nur, was du selbst einstellst: deine Wortlisten und Ausnahmen, deine Einstellungen (Sprache, Farben, Symbol), hinzugefügte Websites und einen Zähler ausgeblendeter Spoiler. Alles liegt im lokalen Speicher deines Browsers auf deinem Computer.</p>'],
 ['Was es liest und was es nicht behält', '<p>Um zu wissen, was es abdecken soll, liest SpoilGuard den Text der offenen Seite in dem Moment und vergleicht ihn mit deinen Listen. Dieser Text wird nie gespeichert oder gesendet. SpoilGuard speichert keinen Verlauf.</p>'],
 ['Synchronisierung (optional)', '<p>Aus, solange du sie nicht einschaltest. Dann speichert <em>die Synchronisierung deines Browsers</em> eine Kopie deiner Listen und Einstellungen in deinem Konto, wie deine Lesezeichen. SpoilGuard selbst verbindet sich weiterhin mit nichts. Beim Ausschalten wird die Kopie gelöscht.</p>'],
 ['Berechtigungen', '<ul><li><strong>Speicher</strong>: für deine Listen und Einstellungen.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok und Twitch</strong>: um dort Spoiler abzudecken.</li><li><strong>Andere Seiten, nur wenn du sie hinzufügst</strong>: der Browser fragt Seite für Seite.</li><li><strong>Aktiver Tab</strong>: um zu wissen, auf welcher Seite du bist, wenn du „Auch diese Seite schützen“ drückst.</li><li><strong>Scripting</strong>: um den Filter auf hinzugefügten Seiten zu aktivieren.</li><li><strong>Kontextmenüs</strong>: für die Rechtsklick-Option „Mit SpoilGuard sperren“. Du kannst sie in den Einstellungen ausschalten.</li></ul>'],
 ['Prüf es selbst', '<ol><li><strong>Geh offline.</strong> Schalte das WLAN aus: SpoilGuard funktioniert weiter.</li><li><strong>Beobachte das Netzwerk.</strong> Drück <kbd>F12</kbd>, öffne den Tab <em>Netzwerk</em> und nutze SpoilGuard: keine einzige Anfrage von ihm.</li><li><strong>Lies den Code.</strong> Der gesamte Code steckt lesbar und unverschleiert in der Erweiterung.</li></ol>'],
 ['Externe Links', '<p>Der Ko-fi-Knopf (freiwilliges Trinkgeld) und Links wie diese Erklärung öffnen nur beim Anklicken eine Seite, und SpoilGuard sendet nichts mit. Ko-fi ist ein eigenständiger Dienst. Trinkgeld schaltet nichts frei: SpoilGuard ist vollständig und kostenlos.</p>'],
 ['Kinder', '<p>SpoilGuard sammelt von niemandem Daten, auch nicht von Kindern. Keine Werbung, keine Konten, keine Chats.</p>'],
 ['Änderungen', '<p>Müsste SpoilGuard Daten je anders behandeln, würdest du vorher in der Erweiterung klar informiert, diese Seite würde aktualisiert und nichts würde sich ohne deine Zustimmung ändern.</p>'],
 ['Kontakt', '<p>Für Fragen, Vorschläge oder Fehler hinterlasse eine Bewertung oder nutze den Support-Bereich auf der SpoilGuard-Seite im Erweiterungs-Store deines Browsers. Jede Nachricht wird gelesen.</p>']]},
it: { name: 'Italiano', t: 'Informativa sulla privacy', u: 'Ultimo aggiornamento: 17 novembre 2026 · Versione 1.0',
 lead: '<strong>SpoilGuard non raccoglie, non condivide e non vende nessun tuo dato.</strong> Non ha server. Tutto avviene nel tuo browser, e funziona anche senza connessione a internet.',
 s: [
 ['Cosa salva SpoilGuard e dove', '<p>Solo ciò che imposti tu: liste di parole ed eccezioni, impostazioni (lingua, colori, icona), siti aggiunti e un contatore di spoiler nascosti. Tutto resta nella memoria locale del browser, sul tuo computer.</p>'],
 ['Cosa legge e cosa non conserva', '<p>Per sapere cosa coprire, SpoilGuard legge il testo della pagina aperta, sul momento, e lo confronta con le tue liste. Quel testo non viene mai salvato né inviato. SpoilGuard non conserva la cronologia.</p>'],
 ['Sincronizzazione (facoltativa)', '<p>Spenta finché non la attivi. In quel caso una copia di liste e impostazioni viene salvata dalla <em>sincronizzazione del tuo browser</em> nel tuo account, come i preferiti. SpoilGuard continua a non collegarsi a niente. Disattivandola, la copia viene cancellata.</p>'],
 ['Permessi', '<ul><li><strong>Archiviazione</strong>: per salvare liste e impostazioni.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok e Twitch</strong>: per coprire gli spoiler su quei siti.</li><li><strong>Altri siti, solo se li aggiungi</strong>: il browser chiede sito per sito.</li><li><strong>Scheda attiva</strong>: per sapere su che sito sei quando premi «Proteggi anche questo sito».</li><li><strong>Scripting</strong>: per attivare il filtro sui siti aggiunti.</li><li><strong>Menu contestuali</strong>: per l’opzione del clic destro «Vieta con SpoilGuard». Puoi disattivarla nelle Impostazioni.</li></ul>'],
 ['Controlla tu stesso', '<ol><li><strong>Vai offline.</strong> Spegni il Wi-Fi: SpoilGuard continua a funzionare.</li><li><strong>Guarda la rete.</strong> Premi <kbd>F12</kbd>, apri la scheda <em>Rete</em> e usa SpoilGuard: nessuna sua richiesta.</li><li><strong>Leggi il codice.</strong> Tutto il codice è nell’estensione, leggibile e non offuscato.</li></ol>'],
 ['Link esterni', '<p>Il pulsante Ko-fi (mancia facoltativa) e link come questa informativa aprono una pagina solo se li clicchi, e SpoilGuard non invia niente. Ko-fi è un servizio indipendente. La mancia non sblocca niente: SpoilGuard è completo e gratuito.</p>'],
 ['Minori', '<p>SpoilGuard non raccoglie dati di nessuno, minori compresi. Niente pubblicità, account o chat.</p>'],
 ['Modifiche', '<p>Se un giorno SpoilGuard dovesse trattare i dati diversamente, verresti avvisato chiaramente nell’estensione prima della modifica, questa pagina verrebbe aggiornata e nulla cambierebbe senza il tuo consenso.</p>'],
 ['Contatti', '<p>Per domande, suggerimenti o bug, lascia una recensione o usa la sezione assistenza della pagina di SpoilGuard nello store di estensioni del tuo browser. Ogni messaggio viene letto.</p>']]},
nl: { name: 'Nederlands', t: 'Privacybeleid', u: 'Laatst bijgewerkt: 17 november 2026 · Versie 1.0',
 lead: '<strong>SpoilGuard verzamelt, deelt en verkoopt geen enkele gegevens van je.</strong> Het heeft geen server. Alles gebeurt in je browser, en het werkt zelfs zonder internet.',
 s: [
 ['Wat SpoilGuard bewaart en waar', '<p>Alleen wat je zelf instelt: je woordenlijsten en uitzonderingen, je instellingen (taal, kleuren, pictogram), toegevoegde websites en een teller van verborgen spoilers. Alles staat in de lokale opslag van je browser, op je eigen computer.</p>'],
 ['Wat het leest en niet bewaart', '<p>Om te weten wat het moet afdekken, leest SpoilGuard op dat moment de tekst van de open pagina en vergelijkt die met je lijsten. Die tekst wordt nooit opgeslagen of verstuurd. SpoilGuard bewaart geen geschiedenis.</p>'],
 ['Synchronisatie (optioneel)', '<p>Uit, tenzij je het aanzet. Dan bewaart <em>de synchronisatie van je browser</em> een kopie van je lijsten en instellingen in je account, net als je bladwijzers. SpoilGuard maakt zelf nog steeds geen verbinding. Zet je het uit, dan wordt de kopie verwijderd.</p>'],
 ['Rechten', '<ul><li><strong>Opslag</strong>: voor je lijsten en instellingen.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok en Twitch</strong>: om daar spoilers af te dekken.</li><li><strong>Andere sites, alleen als je ze toevoegt</strong>: de browser vraagt het per site.</li><li><strong>Actief tabblad</strong>: om te weten op welke site je bent als je op “Ook deze site beschermen” drukt.</li><li><strong>Scripting</strong>: om het filter op toegevoegde sites aan te zetten.</li><li><strong>Contextmenu’s</strong>: voor de rechtsklikoptie “Blokkeren met SpoilGuard”. Je kunt dit uitzetten in Instellingen.</li></ul>'],
 ['Controleer het zelf', '<ol><li><strong>Ga offline.</strong> Zet je wifi uit: SpoilGuard blijft werken.</li><li><strong>Bekijk het netwerk.</strong> Druk op <kbd>F12</kbd>, open het tabblad <em>Netwerk</em> en gebruik SpoilGuard: geen enkel verzoek van SpoilGuard.</li><li><strong>Lees de code.</strong> Alle code zit leesbaar en niet versluierd in de extensie.</li></ol>'],
 ['Externe links', '<p>De Ko-fi-knop (vrijwillige fooi) en links zoals dit beleid openen alleen een pagina als je erop klikt, en SpoilGuard stuurt niets mee. Ko-fi is een zelfstandige dienst. Een fooi ontgrendelt niets: SpoilGuard is compleet en gratis.</p>'],
 ['Kinderen', '<p>SpoilGuard verzamelt van niemand gegevens, ook niet van kinderen. Geen advertenties, accounts of chats.</p>'],
 ['Wijzigingen', '<p>Zou SpoilGuard ooit anders met gegevens moeten omgaan, dan krijg je dat vooraf duidelijk te horen in de extensie, wordt deze pagina bijgewerkt en verandert er niets zonder je toestemming.</p>'],
 ['Contact', '<p>Voor vragen, suggesties of fouten laat je een review achter of gebruik je het ondersteuningsgedeelte op de SpoilGuard-pagina in de extensiewinkel van je browser. Elk bericht wordt gelezen.</p>']]},
pl: { name: 'Polski', t: 'Polityka prywatności', u: 'Ostatnia aktualizacja: 17 listopada 2026 · Wersja 1.0',
 lead: '<strong>SpoilGuard nie zbiera, nie udostępnia i nie sprzedaje żadnych twoich danych.</strong> Nie ma serwera. Wszystko dzieje się w twojej przeglądarce i działa nawet bez internetu.',
 s: [
 ['Co SpoilGuard zapisuje i gdzie', '<p>Tylko to, co sam ustawisz: listy słów i wyjątki, ustawienia (język, kolory, ikona), dodane strony i licznik ukrytych spoilerów. Wszystko zostaje w lokalnej pamięci przeglądarki, na twoim komputerze.</p>'],
 ['Co czyta i czego nie zachowuje', '<p>Aby wiedzieć, co zasłonić, SpoilGuard czyta tekst otwartej strony w danej chwili i porównuje go z twoimi listami. Ten tekst nigdy nie jest zapisywany ani wysyłany. SpoilGuard nie przechowuje historii.</p>'],
 ['Synchronizacja (opcjonalna)', '<p>Wyłączona, dopóki jej nie włączysz. Wtedy kopię list i ustawień przechowuje <em>synchronizacja twojej przeglądarki</em> na twoim koncie, jak zakładki. SpoilGuard nadal sam niczego nie łączy. Po wyłączeniu kopia jest usuwana.</p>'],
 ['Uprawnienia', '<ul><li><strong>Pamięć</strong>: na listy i ustawienia.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok i Twitch</strong>: aby zasłaniać tam spoilery.</li><li><strong>Inne strony, tylko jeśli je dodasz</strong>: przeglądarka pyta o każdą osobno.</li><li><strong>Aktywna karta</strong>: aby wiedzieć, na jakiej stronie jesteś, gdy naciśniesz „Chroń też tę stronę”.</li><li><strong>Scripting</strong>: aby włączyć filtr na dodanych stronach.</li><li><strong>Menu kontekstowe</strong>: dla opcji prawego przycisku „Zablokuj w SpoilGuard”. Możesz ją wyłączyć w Ustawieniach.</li></ul>'],
 ['Sprawdź sam', '<ol><li><strong>Odłącz internet.</strong> Wyłącz wi-fi: SpoilGuard dalej działa.</li><li><strong>Obserwuj sieć.</strong> Naciśnij <kbd>F12</kbd>, otwórz kartę <em>Sieć</em> i używaj SpoilGuard: żadnego jego żądania.</li><li><strong>Przeczytaj kod.</strong> Cały kod jest w rozszerzeniu, czytelny i nieukryty.</li></ol>'],
 ['Linki zewnętrzne', '<p>Przycisk Ko-fi (dobrowolny napiwek) i linki takie jak ta polityka otwierają stronę tylko po kliknięciu, a SpoilGuard niczego nie wysyła. Ko-fi to niezależna usługa. Napiwek niczego nie odblokowuje: SpoilGuard jest kompletny i darmowy.</p>'],
 ['Dzieci', '<p>SpoilGuard nie zbiera danych od nikogo, także od dzieci. Bez reklam, kont i czatów.</p>'],
 ['Zmiany', '<p>Gdyby SpoilGuard kiedyś musiał inaczej traktować dane, zostaniesz o tym wyraźnie poinformowany w rozszerzeniu przed zmianą, ta strona zostanie zaktualizowana i nic nie zmieni się bez twojej zgody.</p>'],
 ['Kontakt', '<p>W sprawie pytań, sugestii lub błędów zostaw opinię albo skorzystaj z sekcji pomocy na stronie SpoilGuard w sklepie z rozszerzeniami twojej przeglądarki. Każda wiadomość jest czytana.</p>']]},
'pt-BR': { name: 'Português (Brasil)', t: 'Política de privacidade', u: 'Última atualização: 17 de novembro de 2026 · Versão 1.0',
 lead: '<strong>O SpoilGuard não coleta, não compartilha e não vende nenhum dado seu.</strong> Ele não tem servidor. Tudo acontece no seu navegador, e funciona até sem internet.',
 s: [
 ['O que o SpoilGuard guarda e onde', '<p>Só o que você configura: suas listas de palavras e exceções, seus ajustes (idioma, cores, ícone), os sites adicionados e um contador de spoilers escondidos. Tudo fica no armazenamento local do navegador, no seu computador.</p>'],
 ['O que ele lê e o que não guarda', '<p>Para saber o que cobrir, o SpoilGuard lê o texto da página aberta, na hora, e compara com suas listas. Esse texto nunca é salvo nem enviado. O SpoilGuard não guarda seu histórico.</p>'],
 ['Sincronização (opcional)', '<p>Desligada a menos que você ligue. Nesse caso, uma cópia das listas e ajustes é guardada pela <em>sincronização do seu navegador</em> na sua conta, como os favoritos. O SpoilGuard continua sem se conectar a nada. Ao desligar, a cópia é apagada.</p>'],
 ['Permissões', '<ul><li><strong>Armazenamento</strong>: para guardar listas e ajustes.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok e Twitch</strong>: para cobrir spoilers nesses sites.</li><li><strong>Outros sites, só se você adicionar</strong>: o navegador pergunta site por site.</li><li><strong>Aba ativa</strong>: para saber em que site você está ao tocar em “Proteger também este site”.</li><li><strong>Scripting</strong>: para ligar o filtro nos sites adicionados.</li><li><strong>Menus de contexto</strong>: para a opção do botão direito “Bloquear no SpoilGuard”. Você pode desligá-la nos Ajustes.</li></ul>'],
 ['Confira você mesmo', '<ol><li><strong>Fique offline.</strong> Desligue o wi-fi: o SpoilGuard continua funcionando.</li><li><strong>Observe a rede.</strong> Aperte <kbd>F12</kbd>, abra a aba <em>Rede</em> e use o SpoilGuard: nenhuma requisição dele.</li><li><strong>Leia o código.</strong> Todo o código está na extensão, legível e sem ofuscação.</li></ol>'],
 ['Links externos', '<p>O botão do Ko-fi (gorjeta opcional) e links como esta política só abrem uma página quando você clica, e o SpoilGuard não envia nada. O Ko-fi é um serviço independente. A gorjeta não desbloqueia nada: o SpoilGuard é completo e grátis.</p>'],
 ['Crianças', '<p>O SpoilGuard não coleta dados de ninguém, nem de crianças. Sem anúncios, contas ou chats.</p>'],
 ['Mudanças', '<p>Se um dia o SpoilGuard precisar tratar dados de outro jeito, você será avisado com clareza dentro da extensão antes da mudança, esta página será atualizada e nada mudará sem o seu consentimento.</p>'],
 ['Contato', '<p>Para dúvidas, sugestões ou bugs, deixe uma avaliação ou use a seção de suporte da página do SpoilGuard na loja de extensões do seu navegador. Todas as mensagens são lidas.</p>']]},
'pt-PT': { name: 'Português (Portugal)', t: 'Política de privacidade', u: 'Última atualização: 17 de novembro de 2026 · Versão 1.0',
 lead: '<strong>O SpoilGuard não recolhe, não partilha e não vende nenhum dado teu.</strong> Não tem servidor. Tudo acontece no teu navegador, e funciona mesmo sem internet.',
 s: [
 ['O que o SpoilGuard guarda e onde', '<p>Só o que configuras: as tuas listas de palavras e exceções, as tuas definições (idioma, cores, ícone), os sites adicionados e um contador de spoilers escondidos. Tudo fica no armazenamento local do navegador, no teu computador.</p>'],
 ['O que lê e o que não guarda', '<p>Para saber o que tapar, o SpoilGuard lê o texto da página aberta, no momento, e compara-o com as tuas listas. Esse texto nunca é guardado nem enviado. O SpoilGuard não guarda o teu histórico.</p>'],
 ['Sincronização (opcional)', '<p>Desligada, a não ser que a ligues. Nesse caso, uma cópia das listas e definições é guardada pela <em>sincronização do teu navegador</em> na tua conta, como os marcadores. O SpoilGuard continua sem se ligar a nada. Ao desligar, a cópia é apagada.</p>'],
 ['Permissões', '<ul><li><strong>Armazenamento</strong>: para guardar listas e definições.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok e Twitch</strong>: para tapar spoilers nesses sites.</li><li><strong>Outros sites, só se os adicionares</strong>: o navegador pergunta site a site.</li><li><strong>Separador ativo</strong>: para saber em que site estás ao carregar em «Proteger também este site».</li><li><strong>Scripting</strong>: para ligar o filtro nos sites adicionados.</li><li><strong>Menus de contexto</strong>: para a opção do botão direito «Bloquear no SpoilGuard». Podes desligá-la nas Definições.</li></ul>'],
 ['Confirma tu mesmo', '<ol><li><strong>Fica offline.</strong> Desliga o wi-fi: o SpoilGuard continua a funcionar.</li><li><strong>Observa a rede.</strong> Carrega em <kbd>F12</kbd>, abre o separador <em>Rede</em> e usa o SpoilGuard: nenhum pedido dele.</li><li><strong>Lê o código.</strong> Todo o código está na extensão, legível e sem ofuscação.</li></ol>'],
 ['Ligações externas', '<p>O botão do Ko-fi (gorjeta opcional) e ligações como esta política só abrem uma página quando clicas, e o SpoilGuard não envia nada. O Ko-fi é um serviço independente. A gorjeta não desbloqueia nada: o SpoilGuard é completo e gratuito.</p>'],
 ['Crianças', '<p>O SpoilGuard não recolhe dados de ninguém, nem de crianças. Sem anúncios, contas ou chats.</p>'],
 ['Alterações', '<p>Se um dia o SpoilGuard tiver de tratar dados de outra forma, serás avisado claramente na extensão antes da alteração, esta página será atualizada e nada mudará sem o teu consentimento.</p>'],
 ['Contacto', '<p>Para dúvidas, sugestões ou erros, deixa uma avaliação ou usa a secção de suporte da página do SpoilGuard na loja de extensões do teu navegador. Todas as mensagens são lidas.</p>']]},
tr: { name: 'Türkçe', t: 'Gizlilik politikası', u: 'Son güncelleme: 17 Kasım 2026 · Sürüm 1.0',
 lead: '<strong>SpoilGuard hiçbir verini toplamaz, paylaşmaz veya satmaz.</strong> Sunucusu yoktur. Her şey tarayıcında olur ve internet bağlantısı olmadan bile çalışır.',
 s: [
 ['SpoilGuard neyi nerede saklar', '<p>Sadece senin ayarladıklarını: kelime listelerin ve istisnaların, ayarların (dil, renkler, simge), eklediğin siteler ve gizlenen spoiler sayacı. Hepsi kendi bilgisayarında, tarayıcının yerel depolamasında durur.</p>'],
 ['Neyi okur, neyi saklamaz', '<p>Neyi kapatacağını bilmek için SpoilGuard açık sayfanın metnini o anda okur ve listelerinle karşılaştırır. Bu metin asla kaydedilmez veya gönderilmez. SpoilGuard geçmişini saklamaz.</p>'],
 ['Senkronizasyon (isteğe bağlı)', '<p>Sen açmadıkça kapalıdır. Açarsan, listelerinin ve ayarlarının bir kopyası yer işaretlerinde olduğu gibi <em>tarayıcının kendi senkronizasyonu</em> tarafından hesabında saklanır. SpoilGuard yine hiçbir yere bağlanmaz. Kapatınca kopya silinir.</p>'],
 ['İzinler', '<ul><li><strong>Depolama</strong>: listelerini ve ayarlarını saklamak için.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok ve Twitch</strong>: bu sitelerde spoilerları kapatmak için.</li><li><strong>Diğer siteler, sadece sen eklersen</strong>: tarayıcı her site için ayrı sorar.</li><li><strong>Etkin sekme</strong>: “Bu siteyi de koru”ya bastığında hangi sitede olduğunu bilmek için.</li><li><strong>Scripting</strong>: eklediğin sitelerde filtreyi açmak için.</li><li><strong>Bağlam menüleri</strong>: sağ tık seçeneği “SpoilGuard ile engelle” için. Ayarlar’dan kapatabilirsin.</li></ul>'],
 ['Kendin kontrol et', '<ol><li><strong>Çevrimdışı ol.</strong> Wi-Fi’ı kapat: SpoilGuard çalışmaya devam eder.</li><li><strong>Ağı izle.</strong> <kbd>F12</kbd>’ye bas, <em>Ağ</em> sekmesini aç ve SpoilGuard’ı kullan: ondan tek bir istek bile görmezsin.</li><li><strong>Kodu oku.</strong> Tüm kod uzantının içinde, okunabilir ve gizlenmemiş halde.</li></ol>'],
 ['Dış bağlantılar', '<p>Ko-fi düğmesi (isteğe bağlı bahşiş) ve bu politika gibi bağlantılar sadece tıkladığında bir sayfa açar ve SpoilGuard hiçbir şey göndermez. Ko-fi bağımsız bir hizmettir. Bahşiş hiçbir şeyin kilidini açmaz: SpoilGuard eksiksiz ve ücretsizdir.</p>'],
 ['Çocuklar', '<p>SpoilGuard kimseden veri toplamaz, çocuklardan da. Reklam, hesap veya sohbet yoktur.</p>'],
 ['Değişiklikler', '<p>SpoilGuard bir gün verileri farklı işlemek zorunda kalırsa, değişiklikten önce uzantı içinde açıkça bilgilendirilirsin, bu sayfa güncellenir ve iznin olmadan hiçbir şey değişmez.</p>'],
 ['İletişim', '<p>Sorular, öneriler veya hatalar için tarayıcının uzantı mağazasındaki SpoilGuard sayfasında yorum bırak ya da destek bölümünü kullan. Her mesaj okunur.</p>']]},
ru: { name: 'Русский', t: 'Политика конфиденциальности', u: 'Последнее обновление: 17 ноября 2026 · Версия 1.0',
 lead: '<strong>SpoilGuard не собирает, не передаёт и не продаёт никаких ваших данных.</strong> У него нет сервера. Всё происходит в вашем браузере, и он работает даже без интернета.',
 s: [
 ['Что SpoilGuard хранит и где', '<p>Только то, что вы настроили сами: списки слов и исключения, настройки (язык, цвета, значок), добавленные сайты и счётчик скрытых спойлеров. Всё хранится в локальном хранилище браузера на вашем компьютере.</p>'],
 ['Что он читает и чего не хранит', '<p>Чтобы понять, что закрыть, SpoilGuard читает текст открытой страницы в момент просмотра и сравнивает его с вашими списками. Этот текст никогда не сохраняется и не отправляется. SpoilGuard не хранит историю.</p>'],
 ['Синхронизация (по желанию)', '<p>Выключена, пока вы её не включите. Тогда копию списков и настроек хранит <em>синхронизация вашего браузера</em> в вашем аккаунте, как закладки. Сам SpoilGuard по-прежнему никуда не подключается. При выключении копия удаляется.</p>'],
 ['Разрешения', '<ul><li><strong>Хранилище</strong>: для списков и настроек.</li><li><strong>Google, X, YouTube, Instagram, Reddit, Facebook, Threads, Bluesky, TikTok и Twitch</strong>: чтобы закрывать спойлеры на этих сайтах.</li><li><strong>Другие сайты, только если вы их добавите</strong>: браузер спрашивает отдельно для каждого.</li><li><strong>Активная вкладка</strong>: чтобы знать, на каком вы сайте, когда нажимаете «Защищать и этот сайт».</li><li><strong>Scripting</strong>: чтобы включать фильтр на добавленных сайтах.</li><li><strong>Контекстные меню</strong>: для пункта правой кнопки «Запретить в SpoilGuard». Его можно отключить в Настройках.</li></ul>'],

 ['문의', '<p>질문, 제안, 오류는 브라우저 확장 프로그램 스토어의 SpoilGuard 페이지에서 리뷰를 남기거나 지원 섹션을 이용해 주세요. 모든 메시지를 읽습니다.</p>']]}
};

</script>
<script>
/* SpoilGuard · política de privacidad: dibuja el texto en el idioma elegido y gestiona el selector */
(() => {
  const P = globalThis.SG_PRIV, $ = s => document.querySelector(s);
  const ORDER = ['en', 'es', 'ca', 'fr', 'de', 'it', 'nl', 'pl', 'pt-BR', 'pt-PT', 'tr', 'ru', 'ja', 'zh-CN', 'ko'];
  const SEARCH = { en: 'Search…', es: 'Buscar…', ca: 'Cerca…', fr: 'Rechercher…', de: 'Suchen…', it: 'Cerca…', nl: 'Zoeken…', pl: 'Szukaj…', 'pt-BR': 'Buscar…', 'pt-PT': 'Pesquisar…', tr: 'Ara…', ru: 'Поиск…', ja: '検索…', 'zh-CN': '搜索…', ko: '검색…' };
  const NONE = { en: 'No matches', es: 'Sin resultados', ca: 'Cap resultat', fr: 'Aucun résultat', de: 'Keine Treffer', it: 'Nessun risultato', nl: 'Geen resultaten', pl: 'Brak wyników', 'pt-BR': 'Nada encontrado', 'pt-PT': 'Sem resultados', tr: 'Sonuç yok', ru: 'Ничего не найдено', ja: '見つかりません', 'zh-CN': '无结果', ko: '결과 없음' };
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  let cur = 'en', act = -1;

  // texto propio y fijo del archivo de datos: no viene de la red ni del usuario
  const render = (lang, keep) => {
    const d = P[lang] || P.en;
    cur = P[lang] ? lang : 'en';
    const doc = $('#doc');
    doc.innerHTML = `<h1>${d.t}</h1><p class="mut">${d.u}</p><p class="lead">${d.lead}</p>` +
      d.s.map(([h, body]) => `<h2>${h}</h2>${body}`).join('');
    doc.style.animation = 'none'; void doc.offsetWidth; doc.style.animation = '';
    document.documentElement.lang = cur;
    document.title = 'SpoilGuard · ' + d.t;
    $('#langName').textContent = d.name;
    $('#langSearch').placeholder = SEARCH[cur];
    if (keep) try { history.replaceState(null, '', '?lang=' + cur); } catch (_) {} // solo si lo elige el usuario
  };

  const items = () => [...$('#langList').querySelectorAll('li[data-l]')];
  const list = (q = '') => {
    const n = norm(q.trim());
    const hits = ORDER.filter(l => !n || norm(P[l].name).includes(n) || l.toLowerCase().startsWith(n));
    $('#langList').innerHTML = hits.length
      ? hits.map(l => `<li role="option" data-l="${l}" lang="${l}" aria-selected="${l === cur}">${P[l].name}</li>`).join('')
      : `<li class="none">${NONE[cur]}</li>`;
    act = -1;
  };
  const menu = $('#langMenu'), btn = $('#langBtn');
  const open = () => { list(); $('#langSearch').value = ''; menu.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); setTimeout(() => $('#langSearch').focus(), 30); };
  const close = (focus) => { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); if (focus) btn.focus(); };
  const choose = l => { render(l, true); close(true); };

  btn.addEventListener('click', () => menu.classList.contains('open') ? close() : open());
  $('#langList').addEventListener('click', e => { const li = e.target.closest('li[data-l]'); if (li) choose(li.dataset.l); });
  $('#langSearch').addEventListener('input', e => list(e.target.value));
  menu.addEventListener('keydown', e => {
    const it = items();
    if (e.key === 'Escape') { e.preventDefault(); close(true); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!it.length) return;
      act = (act + (e.key === 'ArrowDown' ? 1 : -1) + it.length) % it.length;
      it.forEach((li, i) => li.classList.toggle('act', i === act)); it[act].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); const li = it[act] || (it.length === 1 && it[0]); if (li) choose(li.dataset.l); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.lang')) close(); });

  // idioma: ?lang=xx; dentro de la extensión, el mismo que usa SpoilGuard; si no, inglés
  const match = l => {
    if (!l) return null;
    if (P[l]) return l;
    const low = l.toLowerCase();
    if (low.startsWith('pt')) return /br/.test(low) ? 'pt-BR' : 'pt-PT';
    if (low.startsWith('zh')) return 'zh-CN';
    const base = low.split('-')[0];
    return P[base] ? base : null;
  };
  const q = match(new URLSearchParams(location.search).get('lang'));
  render(q || 'en');

  // el icono y los acentos con el color del tema que haya elegido el usuario
  const HUE = { violet: [248, 90], blue: [215, 90], teal: [184, 80], green: [148, 65], amber: [40, 95], orange: [22, 92], red: [355, 78], pink: [325, 80], graphite: [225, 8] };
  try {
    chrome.storage.local.get(['lang', 'ui']).then(({ lang, ui }) => {
      const u = ui && HUE[ui.hue];
      if (u) {
        const r = document.documentElement.style;
        r.setProperty('--g1', `hsl(${u[0]} ${u[1]}% 58%)`);
        r.setProperty('--g2', `hsl(${u[0] + 22} ${u[1]}% 68%)`);
        r.setProperty('--acc', `hsl(${u[0]} ${u[1]}% ${matchMedia('(prefers-color-scheme: dark)').matches ? 74 : 52}%)`);
      }
      if (!q) { const m = match(lang && lang !== 'auto' ? lang : navigator.language); if (m && m !== cur) render(m); }
    }).catch(() => {});
  } catch (_) {}
})();

</script>
